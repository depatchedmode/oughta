<!doctype html>
<!-- A stand-in for your running app, so the tour can screenshot a live page anywhere. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notifications · Settings</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 20px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: #1d2330; background: #f3f4f7; }
  header { display: flex; align-items: center; gap: 14px; padding: 22px 48px; background: #fff; border-bottom: 1px solid #e2e5ec; font-weight: 600; }
  header .logo { width: 30px; height: 30px; border-radius: 8px; background: #3a63d8; }
  header nav { margin-left: auto; display: flex; gap: 30px; font-weight: 500; color: #5b6475; }
  main { max-width: 980px; margin: 48px auto; padding: 0 48px; }
  h1 { font-size: 36px; margin: 0 0 8px; }
  .lede { color: #5b6475; margin: 0 0 32px; }
  .card { background: #fff; border: 1px solid #e2e5ec; border-radius: 14px; }
  .row { display: flex; align-items: center; gap: 24px; padding: 24px 30px; border-top: 1px solid #edf0f4; }
  .row:first-child { border-top: 0; }
  .row div { flex: 1; }
  .row b { display: block; }
  .row span { color: #5b6475; font-size: 18px; }
  .toggle { width: 58px; height: 32px; border-radius: 16px; background: #c9ced8; position: relative; flex: none; }
  .toggle::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: #fff; }
  .toggle.on { background: #3a63d8; }
  .toggle.on::after { left: 30px; }
  .new { margin-left: 10px; padding: 2px 10px; border-radius: 10px; background: #e6ecfc; color: #2f52b8; font-size: 15px; font-weight: 600; vertical-align: 2px; }
  .saved { display: flex; align-items: center; gap: 12px; margin-top: 24px; padding: 16px 22px; border-radius: 12px; background: #e7f5ee; color: #17603f; font-weight: 500; }
  .saved::before { content: "✓"; font-weight: 700; }
</style>
</head>
<body>
  <header><span class="logo"></span>Ledger<nav><span>Dashboard</span><span>Reports</span><span>Settings</span></nav></header>
  <main>
    <h1>Notifications</h1>
    <p class="lede">Choose what Ledger emails you about.</p>
    <section class="card">
      <div class="row"><div><b>Payment received</b><span>When a customer pays an invoice.</span></div><i class="toggle on"></i></div>
      <div class="row"><div><b>Weekly digest <em class="new">New</em></b><span>A summary of the week, every Monday at 9:00.</span></div><i class="toggle on" id="digest"></i></div>
      <div class="row"><div><b>Invoice overdue</b><span>When an invoice passes its due date.</span></div><i class="toggle"></i></div>
    </section>
    <p class="saved" id="saved">Saved. Your first digest arrives on Monday.</p>
  </main>
</body>
</html>
